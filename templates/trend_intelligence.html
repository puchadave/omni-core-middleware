{% extends "base.html" %}
{% block title %}Trend Intelligence{% endblock %}
{% block content %}
<div class="max-w-7xl mx-auto">
  <h1 class="text-2xl font-bold mb-2">Trend Intelligence</h1>
  
<p class="text-slate-400 mb-4">Trend-Signale und Analyse (OmniRoute/Quellen abhängig).</p>
<div class="flex gap-2 mb-4"><button onclick="runTrend()" class="bg-indigo-600 px-4 py-2 rounded">Trendanalyse starten</button></div>
<div class="bg-slate-900 border border-slate-800 rounded-lg p-4"><pre id="data" class="text-xs bg-slate-950 p-3 rounded overflow-auto max-h-[70vh]">Bereit.</pre></div>
<script>
async function runTrend(){document.getElementById('data').textContent='Läuft…';try{const r=await fetch('/api/ai/trend-analysis',{method:'POST'});document.getElementById('data').textContent=JSON.stringify(await r.json(),null,2);}catch(e){document.getElementById('data').textContent='Nicht konfiguriert: '+e.message;}}
</script>

</div>
{% endblock %}
