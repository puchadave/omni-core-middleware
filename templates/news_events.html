{% extends "base.html" %}
{% block title %}News & Events{% endblock %}
{% block content %}
<div class="max-w-7xl mx-auto">
  <h1 class="text-2xl font-bold mb-2">News & Events</h1>
  
<p class="text-slate-400 mb-4">Kuratiertes News-/Event-Feed (Hardcore, Uptempo, Frenchcore, Gabber, Festivals, Fashion etc.).</p>
<div class="bg-slate-900 border border-slate-800 rounded-lg p-4"><pre id="data" class="text-xs bg-slate-950 p-3 rounded overflow-auto max-h-[70vh]">Lade…</pre></div>
<script>
async function load(){try{const r=await fetch('/api/news');document.getElementById('data').textContent=r.ok?JSON.stringify(await r.json(),null,2):'Nicht konfiguriert';}catch(e){document.getElementById('data').textContent='Nicht konfiguriert';}}
load();
</script>

</div>
{% endblock %}
