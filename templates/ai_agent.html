{% extends "base.html" %}
{% block content %}
<div class="max-w-5xl mx-auto">
    <div class="bg-gray-800 border border-gray-700 rounded-xl p-6">
        <h1 class="text-2xl font-bold">Omni-Core AI Copilot</h1>
        <p class="text-gray-400 mt-2">Natural-language control layer for diagnostics, channels, business rules, CRM and calendar.</p>
        <div class="mt-6 grid md:grid-cols-3 gap-4">
            <div class="bg-gray-900 border border-gray-700 rounded-lg p-4"><div class="text-sm text-gray-400">Read-only</div><div class="mt-1">System diagnostics</div></div>
            <div class="bg-gray-900 border border-gray-700 rounded-lg p-4"><div class="text-sm text-gray-400">Confirmation</div><div class="mt-1">All writes require approval</div></div>
            <div class="bg-gray-900 border border-gray-700 rounded-lg p-4"><div class="text-sm text-gray-400">Protected</div><div class="mt-1">Paid-order fulfillment gate</div></div>
        </div>
        <button class="mt-6 bg-indigo-600 hover:bg-indigo-500 rounded-lg px-4 py-2 font-semibold" onclick="toggleAIAgent()">Copilot öffnen</button>
    </div>
</div>
{% endblock %}
