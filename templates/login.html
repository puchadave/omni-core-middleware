<!DOCTYPE html>
<html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Omni-Core | Anmeldung</title>
<style>:root{color-scheme:dark;--line:#243047;--text:#e5e7eb;--muted:#94a3b8;--accent:#60a5fa}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 50% 20%,#16213b 0,#080b12 55%);font-family:system-ui,sans-serif;color:var(--text)}.card{width:min(420px,calc(100% - 32px));background:#111827ee;border:1px solid var(--line);border-radius:18px;padding:32px;box-shadow:0 20px 80px #0008}.brand{font-weight:800;letter-spacing:.08em}.brand span{color:var(--accent)}h1{font-size:22px;margin:28px 0 8px}.muted{color:var(--muted);font-size:14px;line-height:1.5}label{display:block;margin:24px 0 8px;font-size:13px}input{width:100%;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:#0b1220;color:var(--text)}button{width:100%;margin-top:18px;padding:12px;border:0;border-radius:10px;background:var(--accent);color:#06101f;font-weight:800;cursor:pointer}.error{margin-top:14px;color:#fca5a5;font-size:13px;min-height:18px}</style></head>
<body><form class="card" id="login"><div class="brand">OMNI-CORE <span>CONTROL CENTER</span></div><h1>Interne Anmeldung</h1><p class="muted">Der Control Plane API-Zugriff ist geschützt. Verwende den konfigurierten <code>INTERNAL_API_KEY</code>.</p><label for="key">Internal API Key</label><input id="key" type="password" autocomplete="current-password" required autofocus><button id="submit">Anmelden</button><div class="error" id="error"></div></form>
<script>
document.getElementById('login').addEventListener('submit',async function(e){e.preventDefault();var b=document.getElementById('submit'),x=document.getElementById('error');b.disabled=true;x.textContent='';try{var r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({api_key:document.getElementById('key').value})});if(!r.ok)throw new Error('Ungültiger API-Key');location.href='/';}catch(err){x.textContent=err.message;b.disabled=false;}});
</script></body></html>
