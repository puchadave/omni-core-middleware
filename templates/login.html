<!doctype html>
<html lang="de" class="dark">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Omni-Core Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100 flex items-center justify-center p-4">
  <div class="w-full max-w-md rounded-xl border border-slate-800 bg-slate-900 p-6">
    <h1 class="text-2xl font-bold">Omni-Core Control Center</h1>
    <p class="mt-1 text-sm text-slate-400">Anmeldung mit internem API-Schlüssel</p>
    {% if error %}<div class="mt-4 rounded bg-red-900/40 border border-red-700 p-3 text-sm text-red-200">{{ error }}</div>{% endif %}
    <form method="post" action="/login" class="mt-6 space-y-4">
      <input type="hidden" name="next" value="{{ next_path or '/' }}">
      <div>
        <label class="block text-sm text-slate-300 mb-1">Internal API Key</label>
        <input name="api_key" type="password" required class="w-full rounded border border-slate-700 bg-slate-800 px-3 py-2">
      </div>
      <button class="w-full rounded bg-indigo-600 hover:bg-indigo-500 px-4 py-2 font-medium">Anmelden</button>
    </form>
    <p class="mt-4 text-xs text-slate-500">Session-basiert (HttpOnly Cookie, SameSite=Lax). API-Zugriff weiterhin via X-Internal-API-Key möglich.</p>
  </div>
</body>
</html>
