{% extends "base.html" %}
{% block title %}Marketplaces{% endblock %}
{% block content %}
<div class="max-w-7xl mx-auto">
  <h1 class="text-2xl font-bold mb-2">Marketplaces</h1>
  
<p class="text-slate-400 mb-4">Einheitliches Channel-/Marketplace-Management (Shopware, eBay, Google Merchant, weitere).</p>
<div class="bg-slate-900 border border-slate-800 rounded-lg p-4"><pre id="data" class="text-xs bg-slate-950 p-3 rounded overflow-auto max-h-[70vh]">Lade…</pre></div>
<script>
async function load(){let out={channels:[],google:null,shopware:null,exports:null};
try{out.exports=await (await fetch('/api/export/channels')).json();}catch(e){out.exports='Nicht verfügbar';}
try{out.google=await (await fetch('/api/google/accounts')).json();}catch(e){out.google='Nicht konfiguriert';}
try{out.shopware=await (await fetch('/api/shop/connections')).json();}catch(e){out.shopware='Nicht konfiguriert';}
document.getElementById('data').textContent=JSON.stringify(out,null,2);}load();
</script>

</div>
{% endblock %}
