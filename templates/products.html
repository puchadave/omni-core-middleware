{% extends "base.html" %}
{% block title %}Products | Omni-Core{% endblock %}
{% block content %}
<div x-data="prodPage()" x-init="load()" class="space-y-4 max-w-7xl mx-auto">
  <div class="flex justify-between items-end"><div><h1 class="text-2xl font-bold">Products</h1><p class="text-slate-400">Produktliste, Suche, Filter und Status</p></div><button @click="load()" class="bg-slate-700 hover:bg-slate-600 px-4 py-2 rounded text-sm">Aktualisieren</button></div>
  <div class="bg-slate-900 border border-slate-800 rounded-lg p-4 flex flex-wrap gap-2">
    <input x-model="q" placeholder="Suche SKU/Titel/Kategorie" class="flex-1 min-w-[220px] bg-slate-800 border border-slate-700 rounded px-3 py-2 text-sm">
    <select x-model="status" class="bg-slate-800 border border-slate-700 rounded px-3 py-2 text-sm"><option value="">Alle Status</option><option>active</option><option>draft</option><option>paused</option><option>archived</option></select>
  </div>
  <template x-if="error"><div class="rounded border border-red-700 bg-red-900/30 p-3 text-sm text-red-200" x-text="error"></div></template>
  <template x-if="!error && filtered().length===0"><div class="rounded border border-amber-700 bg-amber-900/20 p-3 text-sm text-amber-200">Keine Produkte vorhanden oder Filter ohne Treffer.</div></template>
  <div class="bg-slate-900 border border-slate-800 rounded-lg overflow-auto" x-show="filtered().length">
    <table class="w-full text-sm"><thead class="text-slate-400 bg-slate-950/50"><tr><th class="p-2 text-left">SKU</th><th class="p-2 text-left">Titel</th><th class="p-2 text-left">Kategorie</th><th class="p-2 text-left">Preis</th><th class="p-2 text-left">Bestand</th><th class="p-2 text-left">Status</th></tr></thead><tbody>
      <template x-for="p in filtered()" :key="p.sku"><tr class="border-t border-slate-800 hover:bg-slate-800/40"><td class="p-2 font-mono text-xs" x-text="p.sku"></td><td class="p-2" x-text="p.ai_title||p.title||'—'"></td><td class="p-2" x-text="p.category||'—'"></td><td class="p-2" x-text="p.supplier_price ?? '—'"></td><td class="p-2" x-text="p.stock ?? 0"></td><td class="p-2" x-text="p.status||'—'"></td></tr></template>
    </tbody></table>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script>
function prodPage(){return{items:[],q:'',status:'',error:'',async load(){this.error=''; try{this.items=await apiFetch('/api/products?limit=1000'); if(!Array.isArray(this.items)) this.items=[];}catch(e){this.error=e.message; this.items=[];}},filtered(){const q=(this.q||'').toLowerCase(); return this.items.filter(p=>{if(this.status && String(p.status)!==this.status) return false; if(!q) return true; return [p.sku,p.title,p.ai_title,p.category].some(v=>String(v||'').toLowerCase().includes(q));});}}}
</script>
{% endblock %}
