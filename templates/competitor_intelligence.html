{% extends "base.html" %}
{% block title %}Competitor Intelligence{% endblock %}
{% block content %}
<div class="max-w-7xl mx-auto">
  <h1 class="text-2xl font-bold mb-2">Competitor Intelligence</h1>
  
<p class="text-slate-400 mb-4">Wettbewerber, Preis-/Verfügbarkeitsbeobachtung und Alerts (zulässige Quellen).</p>
<div class="bg-slate-900 border border-slate-800 rounded-lg p-4"><pre id="data" class="text-xs bg-slate-950 p-3 rounded overflow-auto max-h-[70vh]">Lade…</pre></div>
<script>
async function load(){try{const r=await fetch('/api/competitor/stats');document.getElementById('data').textContent=r.ok?JSON.stringify(await r.json(),null,2):'Nicht konfiguriert / nicht verfügbar';}catch(e){document.getElementById('data').textContent='Nicht konfiguriert';}}
load();
</script>

</div>
{% endblock %}
