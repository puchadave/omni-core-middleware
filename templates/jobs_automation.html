{% extends "base.html" %}
{% block title %}Jobs & Automation{% endblock %}
{% block content %}
<div class="max-w-7xl mx-auto">
  <h1 class="text-2xl font-bold mb-2">Jobs & Automation</h1>
  
<p class="text-slate-400 mb-4">Persistente Jobs, Queue-Status, Wiederholung/Abbruch und Scheduler-Konfiguration.</p>
<div class="grid md:grid-cols-2 gap-4">
  <div class="bg-slate-900 border border-slate-800 rounded-lg p-4"><h2 class="font-semibold mb-2">Job-Übersicht (API)</h2><pre id="jobs" class="text-xs bg-slate-950 p-3 rounded overflow-auto max-h-80">Lade…</pre></div>
  <div class="bg-slate-900 border border-slate-800 rounded-lg p-4"><h2 class="font-semibold mb-2">Scheduler / Automationen</h2><pre id="sched" class="text-xs bg-slate-950 p-3 rounded overflow-auto max-h-80">Lade…</pre></div>
</div>
<script>
async function load(){try{const r=await fetch('/api/jobs');document.getElementById('jobs').textContent=r.ok?JSON.stringify(await r.json(),null,2):'Nicht verfügbar';}catch(e){document.getElementById('jobs').textContent='Nicht verfügbar';}
try{const r=await fetch('/api/scheduler/config');document.getElementById('sched').textContent=r.ok?JSON.stringify(await r.json(),null,2):JSON.stringify({info:'Standard-Automationen aktiv (In-App Worker/Scheduler). Persistente Job-Tabelle/Config siehe Systemstatus.',defaults:['Matterhorn Import','Lagerbestandssynchronisierung','Preisberechnung','Trendanalyse','Wettbewerberanalyse','Bundle Generation']},null,2);}catch(e){}}
load();
</script>

</div>
{% endblock %}
