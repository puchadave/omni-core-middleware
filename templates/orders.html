{% extends "base.html" %}
{% block title %}Orders | Omni-Core{% endblock %}
{% block content %}
<div x-data="ordPage()" x-init="load()" class="space-y-4 max-w-7xl mx-auto">
  <div class="flex justify-between items-end"><div><h1 class="text-2xl font-bold">Orders</h1><p class="text-slate-400">Bestellungen und Status</p></div><button @click="load()" class="bg-slate-700 hover:bg-slate-600 px-4 py-2 rounded text-sm">Aktualisieren</button></div>
  <template x-if="error"><div class="rounded border border-red-700 bg-red-900/30 p-3 text-sm text-red-200" x-text="error"></div></template>
  <template x-if="!error && items.length===0"><div class="rounded border border-amber-700 bg-amber-900/20 p-3 text-sm text-amber-200">Keine Bestellungen vorhanden.</div></template>
  <div class="bg-slate-900 border border-slate-800 rounded-lg overflow-auto" x-show="items.length">
    <table class="w-full text-sm"><thead class="text-slate-400 bg-slate-950/50"><tr><th class="p-2 text-left">Order ID</th><th class="p-2 text-left">SKU</th><th class="p-2 text-left">Menge</th><th class="p-2 text-left">Kanal</th><th class="p-2 text-left">Status</th><th class="p-2 text-left">Zeit</th></tr></thead><tbody>
      <template x-for="o in items" :key="(o.order_id||o.id||'')+(o.created_at||'')"><tr class="border-t border-slate-800"><td class="p-2 font-mono text-xs" x-text="o.order_id||o.id||'—'"></td><td class="p-2" x-text="o.sku||'—'"></td><td class="p-2" x-text="o.quantity??'—'"></td><td class="p-2" x-text="o.marketplace||o.channel||'—'"></td><td class="p-2" x-text="o.status||'—'"></td><td class="p-2 text-slate-400" x-text="o.created_at||''"></td></tr></template>
    </tbody></table>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script>
function ordPage(){return{items:[],error:'',async load(){this.error=''; try{this.items=await apiFetch('/api/orders?limit=500'); if(!Array.isArray(this.items)) this.items=[];}catch(e){this.error=e.message; this.items=[];}}}}
</script>
{% endblock %}
