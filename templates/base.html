<!DOCTYPE html>
<html lang="en" data-theme="navbar" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Omni-Core Middleware</title>

    <!-- Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Alpine.js via CDN for reactive UI -->
    <script src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js" defer></script>

    <!-- Google Fonts - Inter for modern UI -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Favicon -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 128 128%22 aria-hidden=%22true%22><path d=%22M101.5 100l-16.8-16.8a8 8 0 00-11.3 1l1.4 1.4 15.4 15.4a8 8 0 0011.3-9.9L101.5 100zM11.5 7a4 4 0 100 8 4 4 0 000-8zM0 0h128v128H0zM0 0h128v128H0z%22/%3E"></svg>>

    <title>Omni-Core Middleware</title>
</head>
<body class="bg-gray-900 text-gray-900 font-inter">

    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-md navbar-dark bg-gray-900 sticky top-0">
        <div class="navbar-brand">
            <a href="#" class="text-xl font-bold text-indigo-600">Omni-Core</a>
        </div>
        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ml-auto">
                <li class="nav-item">
                    <a class="nav-link text-white" href="/">Dashboard</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link text-white" href="/admin/products">Produkte</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link text-white" href="/admin/settings">Einstellungen</a>
                </li>
            </ul>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="p-6 pb-24">

        <!-- Flash Messages -->
        {% with messages = get_flashed_messages() %}
        {% if messages %}
        <div class="alert alert-info alert-dismissible fade show mb-4" role="alert">
            {{ messages[0] }}
            <button type="button" class="close" data-dismiss="alert" aria-label="Close">
                <span aria-hidden="true">&times;</span>
            </button>
        </div>
        {% endif %}
        {% endwith %}

        {% block content %}{% endblock %}

    </main>

    <!-- Footer -->
    <footer class="border-t border-gray-800 py-4 text-xs text-gray-500 fixed bottom-0 w-full">
        <div class="container mx-auto">
            <p class="text-center">Omni-Core Middleware v1.0 • System Dashboard</p>
        </div>
    </footer>

    <!-- jQuery (required for some Tailwind features) -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <!-- Bootstrap 5 CDN for additional components -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Alpine.js initialization -->
    <script>
        // Initialize Alpine.js
        window.Alpine = window.Alpine || {};
        Alpine.start();
    </script>
</body>
</html>
