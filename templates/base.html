<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Omni-Core ERP & BI | Control Center</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <style>
        .live-dot { animation: pulse 2s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    </style>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen">
    <nav class="bg-gray-800 border-b border-gray-700 sticky top-0 z-40">
        <div class="container mx-auto px-4 py-3 flex items-center justify-between">
            <a href="/" class="text-xl font-bold text-white">OMNI-CORE <span class="text-indigo-400">ERP & BI</span></a>
            <div class="flex items-center space-x-4">
                <a href="/" class="text-gray-300 hover:text-white">Dashboard</a>
                <a href="/admin/products" class="text-gray-300 hover:text-white">Produkte</a>
                <a href="/admin/orders" class="text-gray-300 hover:text-white">Bestellungen</a>
                <a href="/admin/settings" class="text-gray-300 hover:text-white">Einstellungen</a>
            </div>
        </div>
    </nav>
    <main class="container mx-auto px-4 py-6">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
