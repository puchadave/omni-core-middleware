{% extends "base.html" %}
{% block title %}Settings | Omni-Core{% endblock %}
{% block content %}
<div x-data="setPage()" x-init="load()" class="space-y-4 max-w-7xl mx-auto">
  <div class="flex justify-between items-end"><div><h1 class="text-2xl font-bold">Settings</h1><p class="text-slate-400">Konfiguration (maskierte Secrets, persistente Settings)</p></div><button @click="load()" class="bg-slate-700 hover:bg-slate-600 px-4 py-2 rounded text-sm">Aktualisieren</button></div>
  <div class="bg-slate-900 border border-slate-800 rounded-lg p-4">
    <h2 class="font-semibold mb-2">Setting setzen/aktualisieren</h2>
    <div class="grid md:grid-cols-4 gap-2"><input x-model="key" placeholder="key" class="bg-slate-800 border border-slate-700 rounded px-3 py-2 text-sm"><input x-model="value" placeholder="value" class="md:col-span-2 bg-slate-800 border border-slate-700 rounded px-3 py-2 text-sm"><button @click="save()" class="bg-indigo-600 hover:bg-indigo-500 px-4 py-2 rounded text-sm">Speichern</button></div>
    <div x-show="msg" class="text-sm mt-2" :class="err?'text-red-300':'text-emerald-300'" x-text="msg"></div>
  </div>
  <template x-if="error"><div class="rounded border border-red-700 bg-red-900/30 p-3 text-sm text-red-200" x-text="error"></div></template>
  <div class="bg-slate-900 border border-slate-800 rounded-lg overflow-auto">
    <table class="w-full text-sm"><thead class="text-slate-400 bg-slate-950/50"><tr><th class="p-2 text-left">Key</th><th class="p-2 text-left">Value</th></tr></thead><tbody>
      <template x-for="k in Object.keys(settings).sort()" :key="k"><tr class="border-t border-slate-800"><td class="p-2 font-mono text-xs" x-text="k"></td><td class="p-2 break-all" x-text="settings[k]"></td></tr></template>
      <tr x-show="Object.keys(settings).length===0"><td colspan="2" class="p-3 text-slate-400">Keine Settings vorhanden.</td></tr>
    </tbody></table>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script>
function setPage(){return{settings:{},key:'',value:'',msg:'',err:false,error:'',async load(){this.error=''; try{this.settings=await apiFetch('/api/settings')||{};}catch(e){this.error=e.message; this.settings={};}},async save(){this.msg='';this.err=false; try{await apiFetch('/api/settings',{method:'POST',body:JSON.stringify({key:this.key,value:this.value})}); this.msg='Gespeichert.'; this.value=''; await this.load();}catch(e){this.err=true; this.msg=e.message;}}}}
</script>
{% endblock %}
