{% extends "base.html" %}
{% block title %}Integrations{% endblock %}
{% block content %}
<div class="max-w-7xl mx-auto">
  <h1 class="text-2xl font-bold mb-2">Integrations</h1>
  
<p class="text-slate-400 mb-4">Zentrale Übersicht aller Integrationen, Verbindungsstatus und Konfiguration.</p>
<div class="bg-slate-900 border border-slate-800 rounded-lg p-4"><pre id="data" class="text-xs bg-slate-950 p-3 rounded overflow-auto max-h-[70vh]">Lade…</pre></div>
<script>
async function load(){try{const r=await fetch('/api/integrations/status');document.getElementById('data').textContent=JSON.stringify(await r.json(),null,2);}catch(e){document.getElementById('data').textContent='Fehler: '+e.message;}}
load();
</script>

</div>
{% endblock %}
