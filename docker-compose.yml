version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: omni_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: omnicore
      POSTGRES_PASSWORD: omnicore_pass
      POSTGRES_DB: omnicore
      # Performance-Optimierungen für PostgreSQL
      - POSTGRES_SHARED_BUFFERS=128MB
      - POSTGRES_MAX_PAGES=2000
      - POSTGRES_MIN_PAGESIZE=8KB
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omnicore -d omnicore"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - omnicore-network

  omni-core:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: omni_core
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql+asyncpg://omnicore:omnicore_pass@db:5432/omnicore
      - OMNI_ROUTE_URL=http://localhost:20128/v1
      - OMNI_ROUTE_API_KEY=omni-local-key
    ports:
      - "8000:8000"
    volumes:
      - app_data:/app/data
    networks:
      - omnicore-network

networks:
  omnicore-network:
    driver: bridge

volumes:
  pg_data:
    driver: local
  app_data:
    driver: local